[project]
name = "physical-risk"
version = "1.0.0"
description = "MKM Research Labs Physical Risk Platform"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402", "E741", "F841"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F811", "F821", "E722"]

[tool.ruff.lint.isort]
known-first-party = ["config", "port", "routes", "loaders", "models", "visual", "catch", "floodts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["e2e"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]


[tool.coverage.run]
# Force the C tracer. On Python 3.13.x, coverage 7.x defaults to the
# sys.monitoring core, whose tool registration is silently evicted by some
# C-extension imports mid-suite. That deflates whole-suite coverage by ~15
# points (83.9% observed vs the true 99.3%) even though every test passes and
# each module is fully covered when run in isolation. ctrace is immune.
core = "ctrace"
# config/ was absent until 2026-08-31, which meant the package holding every
# parameter the platform runs on -- paths, model constants, and since rule R7 every
# colour and scale token -- was the one package coverage could not see. It measured
# 94% when first looked at, so it was not merely unmeasured but genuinely below the
# gate; the fallback branches every accessor wraps in a bare `except` were untested,
# and those are exactly the ones that run on a fresh checkout.
source = ["src", "config", "tools/cdm_property_editor"]
omit = [
    "tests/*",
    "*/static/*",
    "src/models/intensity/__main__.py",
    # Alembic migration infra — exercised by `alembic upgrade`/`--sql`, not pytest.
    "src/database/_pg/migrations/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 99
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "pass$",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
# Browser-dependent visual rendering modules (require folium map context)
omit = [
    "src/visual/popups/popup_builder.py",
    "src/visual/popups/gauge_popup.py",
    "src/visual/popups/property_popup/builder.py",
    "src/visual/popups/property_popup/sections.py",
    "src/visual/popups/property_popup/risk.py",
    "src/visual/popups/property_popup/helpers.py",
    "src/visual/layer/gauge_layer.py",
    "src/visual/layer/property_layer/layer.py",
    "src/visual/layer/property_layer/popup.py",
    "src/visual/layer/property_layer/stats.py",
    "src/visual/layer/mortgage_layer/layer.py",
    "src/visual/layer/mortgage_layer/circles.py",
    "src/visual/layer/mortgage_layer/popup.py",
    "src/visual/layer/mortgage_layer/stats.py",
    "src/visual/core/visualizer.py",
    "src/visual/core/map_builder.py",
    "src/visual/utils/data_extractors/gauge_extractor.py",
    "src/visual/utils/data_extractors/property_extractor.py",
    "src/visual/utils/data_extractors/mortgage_extractor.py",
    "src/visual/utils/data_extractors/id_extractor.py",
    "src/visual/utils/color_schemes.py",
    "src/visual/utils/formatters.py",
    "src/visual/utils/risk_assessors.py",
    "src/models/floodrisk/risk_analytics.py",
    "src/models/floodrisk/risk_visualization.py",
    "src/models/floodrisk/flood_risk_model.py",
    "src/models/hazard/pricing.py",
    "src/models/prs/prshc.py",
    "src/models/stress/flood_classifier.py",
    "src/port/src/stressm/classifier.py",
    "src/reports/property/property_page_03_gauge_time_series.py",
    "src/reports/gauge/gauge_page_11_current_risk.py",
    "src/reports/gauge/gauge_page_08_flood_history.py",
]

[tool.coverage.html]
directory = "data/output/audit/coverage"

[tool.coverage.xml]
output = "data/output/audit/coverage.xml"

[tool.coverage.json]
output = "data/output/audit/coverage.json"
