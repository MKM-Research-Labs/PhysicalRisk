<svg viewBox="0 0 500 900" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="500" height="900" fill="white" />

  <defs>
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b63ce" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>

  <!-- Figure title at top -->
  <text x="250" y="30" text-anchor="middle"
        font-family="Georgia, serif" font-size="12" font-style="italic">
    Figure 1 – CDM Landscape Interoperability
  </text>

  <!-- Box metrics: wider/taller, shorter gaps -->
  <!-- x = 60, width = 380, height = 130 -->

  <!-- WeatherLayer -->
  <rect x="60" y="60" width="380" height="130"
        fill="white" stroke="url(#borderGradient)" stroke-width="3" />
  <text x="250" y="95" text-anchor="middle"
        font-family="Georgia, serif" font-size="16" font-weight="bold">
    Weather Layer
  </text>
  <line x1="75" y1="110" x2="425" y2="110"
        stroke="#0b63ce" stroke-width="1.5" />
  <text x="250" y="135" text-anchor="middle"
        font-family="Georgia, serif" font-size="12">
    HRRR Weather data
  </text>
  <text x="250" y="155" text-anchor="middle"
        font-family="Georgia, serif" font-size="12">
    Weather Events CDM
  </text>
  <text x="250" y="175" text-anchor="middle"
        font-family="Georgia, serif" font-size="12">
    Weather Timeseries
  </text>

  <!-- Arrow 1: short, close to boxes -->
  <!-- Weather bottom = 60 + 130 = 190 -->
  <line x1="250" y1="195" x2="250" y2="225"
        stroke="#0b63ce" stroke-width="2" />
  <polygon points="250,235 244,225 256,225"
           fill="#0b63ce" />
  <text x="280" y="220"
        font-family="Georgia, serif" font-size="12" font-style="italic">
    triggers
  </text>

  <!-- HydrologicalLayer -->
  <rect x="60" y="250" width="380" height="130"
        fill="white" stroke="url(#borderGradient)" stroke-width="3" />
  <text x="250" y="285" text-anchor="middle"
        font-family="Georgia, serif" font-size="16" font-weight="bold">
    Hydrological Layer
  </text>
  <line x1="75" y1="300" x2="425" y2="300"
        stroke="#0b63ce" stroke-width="1.5" />
  <text x="250" y="325" text-anchor="middle"
        font-family="Georgia, serif" font-size="12">
    Terrain DEM
  </text>
  <text x="250" y="345" text-anchor="middle"
        font-family="Georgia, serif" font-size="12">
    Flood Events CDM
  </text>
  <text x="250" y="365" text-anchor="middle"
        font-family="Georgia, serif" font-size="12">
    Flood Gauges CDM
  </text>

  <!-- Arrow 2 -->
  <!-- Hydro bottom = 250 + 130 = 380 -->
  <line x1="250" y1="385" x2="250" y2="415"
        stroke="#0b63ce" stroke-width="2" />
  <polygon points="250,425 244,415 256,415"
           fill="#0b63ce" />
  <text x="280" y="410"
        font-family="Georgia, serif" font-size="12" font-style="italic">
    impacts
  </text>

  <!-- FinancialImpactLayer -->
  <rect x="60" y="440" width="380" height="130"
        fill="white" stroke="url(#borderGradient)" stroke-width="3" />
  <text x="250" y="475" text-anchor="middle"
        font-family="Georgia, serif" font-size="16" font-weight="bold">
    Financial Impact Layer
  </text>
  <line x1="75" y1="490" x2="445" y2="490"
        stroke="#0b63ce" stroke-width="1.5" />
  <text x="250" y="515" text-anchor="middle"
        font-family="Georgia, serif" font-size="12">
    Properties CDM
  </text>
  <text x="250" y="535" text-anchor="middle"
        font-family="Georgia, serif" font-size="12">
    Mortgages CDM
  </text>
  <text x="250" y="555" text-anchor="middle"
        font-family="Georgia, serif" font-size="12">
    Insurance CDM
  </text>

  <!-- Arrow 3 -->
  <!-- Financial bottom = 440 + 130 = 570 -->
  <line x1="250" y1="575" x2="250" y2="605"
        stroke="#0b63ce" stroke-width="2" />
  <polygon points="250,615 244,605 256,605"
           fill="#0b63ce" />
  <text x="280" y="600"
        font-family="Georgia, serif" font-size="12" font-style="italic">
    hedges
  </text>

  <!-- RiskTransferLayer -->
  <rect x="60" y="630" width="380" height="130"
        fill="white" stroke="url(#borderGradient)" stroke-width="3" />
  <text x="250" y="665" text-anchor="middle"
        font-family="Georgia, serif" font-size="16" font-weight="bold">
    Risk Transfer Layer
  </text>
  <line x1="75" y1="680" x2="445" y2="680"
        stroke="#0b63ce" stroke-width="1.5" />
  <text x="250" y="705" text-anchor="middle"
        font-family="Georgia, serif" font-size="12">
    Physical Risk Swap CDM
  </text>
  <text x="250" y="725" text-anchor="middle"
        font-family="Georgia, serif" font-size="12">
    Parametric Insurance CDM
  </text>
</svg>
