<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MKM — User & Permission Admin</title>
  <style>
    :root { --bg:#0f1720; --panel:#16212e; --line:#27384a; --txt:#dbe5ef;
            --muted:#8aa0b5; --accent:#3b9dd6; --ok:#2faa6a; --bad:#d9534f; }
    * { box-sizing:border-box; }
    body { margin:0; font:14px/1.45 -apple-system,Segoe UI,Roboto,sans-serif;
           background:var(--bg); color:var(--txt); }
    header { padding:16px 24px; border-bottom:1px solid var(--line);
             display:flex; align-items:center; gap:16px; }
    header h1 { font-size:16px; margin:0; font-weight:600; }
    header .who { margin-left:auto; color:var(--muted); }
    main { padding:24px; max-width:1100px; margin:0 auto; }
    .panel { background:var(--panel); border:1px solid var(--line);
             border-radius:8px; padding:20px; margin-bottom:20px; }
    h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em;
         color:var(--muted); margin:0 0 14px; }
    label { display:block; color:var(--muted); margin:8px 0 4px; font-size:12px; }
    input[type=text], input[type=password] {
      background:var(--bg); border:1px solid var(--line); color:var(--txt);
      border-radius:5px; padding:7px 9px; width:220px; }
    button { background:var(--accent); border:0; color:#fff; padding:7px 14px;
             border-radius:5px; cursor:pointer; font-weight:600; }
    button.ghost { background:transparent; border:1px solid var(--line);
                   color:var(--txt); font-weight:400; }
    button:disabled { opacity:.5; cursor:default; }
    table { border-collapse:collapse; width:100%; }
    th, td { border:1px solid var(--line); padding:7px 9px; text-align:center; }
    th.user, td.user { text-align:left; white-space:nowrap; }
    td.inactive { color:var(--muted); text-decoration:line-through; }
    .caps { font-size:11px; color:var(--muted); }
    .msg { margin-top:10px; min-height:18px; font-size:13px; }
    .msg.err { color:var(--bad); } .msg.ok { color:var(--ok); }
    .hidden { display:none; }
    .row { display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap; }
  </style>
</head>
<body>
  <header>
    <h1>User &amp; Permission Admin</h1>
    <span class="who" id="who"></span>
    <button class="ghost hidden" id="logout">Sign out</button>
  </header>
  <main>
    <section class="panel" id="login-panel">
      <h2>Sign in</h2>
      <div class="row">
        <div><label for="lg-user">Username</label>
          <input type="text" id="lg-user" autocomplete="username"></div>
        <div><label for="lg-pass">Password</label>
          <input type="password" id="lg-pass" autocomplete="current-password"></div>
        <button id="lg-go">Sign in</button>
      </div>
      <div class="msg" id="login-msg"></div>
    </section>

    <section class="panel hidden" id="add-panel">
      <h2>Add user</h2>
      <div class="row">
        <div><label for="nu-user">Username</label><input type="text" id="nu-user"></div>
        <div><label for="nu-name">Display name</label><input type="text" id="nu-name"></div>
        <div><label for="nu-pass">Password</label>
          <input type="password" id="nu-pass"></div>
        <button id="nu-go">Create</button>
      </div>
      <div class="msg" id="add-msg"></div>
    </section>

    <section class="panel hidden" id="grid-panel">
      <h2>Permissions <span class="caps">— tick R / W / C / D per user &amp; function
        (W, C or D imply R)</span></h2>
      <div id="grid"></div>
      <div class="msg" id="grid-msg"></div>
    </section>
  </main>
  <script src="/admin/admin.js"></script>
</body>
</html>
