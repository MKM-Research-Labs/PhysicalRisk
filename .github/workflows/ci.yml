name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.15.0
      - run: ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint
    # Postgres is here for the coverage gate: src/database/_pg is 1% of the lines.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mkm
          POSTGRES_PASSWORD: mkm
          POSTGRES_DB: physicalrisk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mkm -d physicalrisk"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install GDAL system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Create the Postgres schema
        run: alembic upgrade head

      - name: Generate a small Thames portfolio
        # The suite reads a generated portfolio from data/, which is not in git.
        env:
          MKM_ALLOW_NO_POSTGRES: "1"
        run: python phys.py port --all --thames -np 20 -nc 20 -ns 300 --seed 42

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -q \
            --cov=src \
            --cov=tools/cdm_property_editor \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # WP4.2: run the same suite against Postgres (MKM_TEST_BACKEND=pg) to enforce
  # backend parity — every test green on the file backend must be green on pg.
  # No coverage here (the file `test` job owns the coverage gate); some tests
  # skipif(pg) for behaviour pg structurally can't reproduce.
  test-pg:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mkm
          POSTGRES_PASSWORD: mkm
          POSTGRES_DB: physicalrisk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mkm -d physicalrisk"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install GDAL system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Create the Postgres schema
        # env.py reads the URL from config.database (mkm/mkm@127.0.0.1:5432/physicalrisk
        # defaults match the postgres service), so no extra config is needed.
        run: alembic upgrade head

      - name: Generate a small Thames portfolio
        # The suite reads a generated portfolio from data/, which is not in git.
        env:
          MKM_ALLOW_NO_POSTGRES: "1"
        run: python phys.py port --all --thames -np 20 -nc 20 -ns 300 --seed 42

      - name: Import the portfolio into Postgres
        # Read-path tests on Postgres read the imported catchment; each test runs
        # in a rolled-back transaction, so the import survives the whole run.
        # Exits non-zero if the file and Postgres reads disagree.
        env:
          MKM_ALLOW_NO_POSTGRES: "1"
          PYTHONPATH: src
        run: python -m database._pg.cutover thames --import

      - name: Run the test suite on Postgres
        env:
          MKM_TEST_BACKEND: pg
        run: python -m pytest tests/ -q -p no:cacheprovider
