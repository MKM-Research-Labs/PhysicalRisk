# Explicit Compose project name so this stack groups under "physicalrisk" rather
# than the default "docker" (the parent directory name), keeping it distinct from
# other Compose projects on the machine. Project names must be lowercase.
name: physicalrisk

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "5001:5001"
    volumes:
      - ../data:/app/data
    environment:
      - FLASK_ENV=production
      - CATCHMENT_ID=thames
    restart: unless-stopped

  # Local PostgreSQL for the JSON→Postgres migration (WP1). Development only —
  # production provisioning (pooling, backups) is WP5. Defaults match
  # config/database.py so `docker compose up postgres` and the app agree.
  #   docker compose -f docker/docker-compose.yml up -d postgres
  #   alembic upgrade head            # apply the schema (alembic.ini at repo root)
  postgres:
    image: postgres:16
    container_name: mkm-physicalrisk-pg
    environment:
      POSTGRES_DB: physicalrisk
      POSTGRES_USER: mkm
      POSTGRES_PASSWORD: mkm
    ports:
      - "5432:5432"
    volumes:
      # Defaults to the named volume mkm_pgdata (portable: works on CI / any
      # machine). Set MKM_PG_DATA_DIR (see .env) to an absolute host path to keep
      # the database files on a specific disk, e.g. an external SSD.
      - "${MKM_PG_DATA_DIR:-mkm_pgdata}:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mkm -d physicalrisk"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Local MinIO (S3-compatible object store) for the blob tier (WP1) — the
  # binary artifacts that don't belong in a relational/JSONB row: classifiers
  # (.joblib) and typhoon particle files. Development only; production storage
  # (or a cloud S3/GCS target via the same API) is WP5. Defaults match
  # config/database.py's object-store settings.
  #   docker compose -f docker/docker-compose.yml up -d minio
  #   console at http://127.0.0.1:9001 (minioadmin / minioadmin)
  minio:
    image: minio/minio:latest
    container_name: mkm-physicalrisk-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      # Defaults to the named volume mkm_miniodata; set MKM_MINIO_DATA_DIR (see
      # .env) to an absolute host path to keep the object store on a specific disk.
      - "${MKM_MINIO_DATA_DIR:-mkm_miniodata}:/data"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  mkm_pgdata:
  mkm_miniodata:
